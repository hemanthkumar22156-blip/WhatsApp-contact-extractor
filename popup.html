<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Contact Extractor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #17202a;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 12px;
      color: #667781;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #extractBtn {
      background: #128c7e;
      color: white;
    }

    #downloadBtn {
      background: #e9edef;
      color: #17202a;
    }

    #downloadBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .counter {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 16px 0;
    }

    .status {
      text-align: center;
      font-size: 12px;
      color: #667781;
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="header">
    <h2>WhatsApp Contact Extractor</h2>
    <p>Extract visible group contacts</p>
  </div>

  <button id="extractBtn">
    Extract Contacts
  </button>

  <div class="counter" id="counter">
    0 Contacts
  </div>

  <button id="downloadBtn" disabled>
    Download CSV
  </button>

  <div class="status" id="status">
    Open WhatsApp Web and open a group participant list.
  </div>

  <script src="popup.js"></script>

</body>
</html>
